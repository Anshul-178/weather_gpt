name: weathergpt
description: WeatherGPT — AI-powered weather assistant (Flutter client).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  audioplayers: ^6.7.1
  # On-device LLM: llama.cpp engine running GGUF models (Android).
  # The Gemma 3 1B GGUF ships bundled inside the APK (assets/models/) —
  # no in-app download and no Hugging Face token at runtime.
  llama_flutter_android: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled on-device AI model (Gemma 3 1B int4 GGUF, ~769 MB).
  # The .gguf file is NOT committed to git — see assets/models/README.md for
  # the one-time manual step of dropping it here before building the APK.
  # If the file is missing, the app still builds; on-device AI simply reports
  # that the model is not included in that build.
  assets:
    - assets/models/
